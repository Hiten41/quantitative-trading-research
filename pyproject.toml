[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mmbacktest"
version = "1.0.0"
description = "Causal replay of passive quotes on Binance linear perpetual futures"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyarrow>=16", "requests>=2.31", "PyYAML>=6"]

[project.optional-dependencies]
report = ["plotly>=5.20", "Markdown>=3.8"]
dev = ["pytest>=8", "ruff>=0.9","mypy>=1.14"]

[project.scripts]
mmbacktest = "mmbacktest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fundingcarry = ["study_dashboard.html", "study_dashboard.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100


[tool.mypy]
python_version = "3.11"
files = ["src/mmbacktest/strategy.py","src/mmbacktest/portfolio.py","src/mmbacktest/execution.py"]
follow_imports = "silent"
disallow_untyped_defs = true
